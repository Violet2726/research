# KITAB: 约束满足数据集（论文 Table 2）
name = "KITAB"
slug = "kitab"
loader = "kitab_jsonl"
source_path = "kitab/test.jsonl"
source_split = "test"
sample_id_prefix = "kitab"
question_field = "author"
answer_field = "answer_books"
smoke_size = 20
pilot_size = 100
main_size = 300
random_seed = 42
notes = "KITAB constraint satisfaction benchmark. One-book constraint queries."

[[split_presets]]
name = "count20_seed42"
strategy = "shuffle"
size = 20

[[split_presets]]
name = "count100_seed42"
strategy = "shuffle"
size = 100

[[split_presets]]
name = "full300_seed42"
strategy = "shuffle"
size = 300
