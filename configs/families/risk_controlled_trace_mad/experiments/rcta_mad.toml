name = "rcta_mad"
description = "Risk-controlled single-synthesis trace aggregation under a ten-logical-call ceiling."
benchmark_configs = [
  "configs/core/shared/benchmarks/omni-math-2/Omni-Math-2.toml",
  "configs/core/shared/benchmarks/bbeh/bbeh-main.toml",
  "configs/core/shared/benchmarks/gpqa/dataset.toml",
]
protocol = "configs/families/risk_controlled_trace_mad/protocols/rcta_v1.toml"
control_catalog = "configs/families/single_agent/methods/common.toml"
control_methods = ["cot_1", "sc_3", "sc_5", "sc_7", "sc_9"]
rcta_methods = ["adaptive_sc_9", "gsa_trace_1", "mad_5a_r1", "confidence_mad_5a_r1", "rcta_certificate_shadow_1", "rcta_1", "rcta_no_certificate", "rcta_existing_only"]
method_order = ["cot_1", "sc_3", "sc_5", "sc_7", "sc_9", "adaptive_sc_9", "gsa_trace_1", "mad_5a_r1", "confidence_mad_5a_r1", "rcta_certificate_shadow_1", "rcta_1", "rcta_no_certificate", "rcta_existing_only"]
global_seed = 42
control_prompt_version = "single_agent_free_text_v1"
primary_model_ref = "dashscope/qwen-flash"
max_concurrent_requests = 1000
requests_per_minute_limit = 1000

[runtime_profiles.dashscope]
max_concurrent_requests = 1000
requests_per_minute_limit = 1000

[runtime_profiles.xiaomimimo]
max_concurrent_requests = 8
requests_per_minute_limit = 18

[phases.count20_seed42]
benchmark_slugs = ["omni_math_2_filtered", "bbeh"]
split_overrides = { omni_math_2_filtered = "count20_seed42", bbeh = "count20_seed42" }
rcta_methods = ["adaptive_sc_9", "gsa_trace_1", "rcta_certificate_shadow_1"]

[phases.count300_seed42]
benchmark_slugs = ["omni_math_2_filtered", "bbeh"]
split_overrides = { omni_math_2_filtered = "count300_seed42", bbeh = "count300_seed42" }
rcta_methods = ["adaptive_sc_9", "gsa_trace_1", "mad_5a_r1", "confidence_mad_5a_r1", "rcta_certificate_shadow_1", "rcta_no_certificate", "rcta_existing_only"]

[phases.full_seed42]
benchmark_slugs = ["omni_math_2_filtered", "bbeh", "gpqa_diamond"]
split_overrides = { omni_math_2_filtered = "full1000_seed42", bbeh = "full4520_seed42", gpqa_diamond = "full198_seed42" }
rcta_methods = ["adaptive_sc_9", "gsa_trace_1", "mad_5a_r1", "confidence_mad_5a_r1", "rcta_1"]
bbeh_metric = "task_harmonic"
primary_analysis_excludes = "count300_seed42"
no_interim_method_accuracy_inspection = true
