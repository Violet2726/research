name = "mad_innovation"
description = "H-SGSA v5: homogeneous MiMo-v2.5 generation with support-blind adjudication; v4 EVF is read-only historical evidence."
active_version = "v5_hsgsa"
version_registry = "configs/families/risk_controlled_trace_mad/versions.toml"
protocol = "configs/families/risk_controlled_trace_mad/protocols/v5_hsgsa.toml"
benchmark_configs = [
  "configs/core/shared/benchmarks/bbeh/bbeh-main.toml",
  "configs/core/shared/benchmarks/gpqa/dataset.toml",
]
primary_model_ref = "xiaomimimo/mimo-v2.5"
global_seed = 42
max_concurrent_requests = 15
requests_per_minute_limit = 18

methods = [
  "cot_1",
  "sc_3",
  "sc_5",
  "adaptive_sc_8",
  "conditional_resample_3",
  "blind_gsa_1",
  "blind_gsa_quorum_3",
  "hsgsa_unanimous_3",
]

[runtime_profiles.xiaomimimo]
max_concurrent_requests = 15
requests_per_minute_limit = 18

[method_descriptions]
cot_1 = "First homogeneous Stage-A solve."
sc_3 = "Hash-tie-broken answer-class majority over the first three shared Stage-A solves."
sc_5 = "Hash-tie-broken answer-class majority over all five shared Stage-A solves."
adaptive_sc_8 = "On Stage-A answer-class disagreement, majority over five Stage-A plus three shared independent resamples; otherwise SC5."
conditional_resample_3 = "On disagreement, majority among the three shared independent resamples; otherwise SC5."
blind_gsa_1 = "One support-blind homogeneous reviewer may select an existing non-anchor class."
blind_gsa_quorum_3 = "At least two of three support-blind homogeneous reviewers must select the same existing non-anchor class."
hsgsa_unanimous_3 = "All three valid support-blind homogeneous reviewers must select the same existing non-anchor class; generated answers never enter the final candidate set."

[phases.replay_dev_seed42]
benchmark_slugs = ["bbeh"]
split_overrides = { bbeh = "count300_seed42" }
replay_only = true
source_run = "local/runs/selective_gsa_mad/sgsa_mad/count300_seed42/20260711T174756Z-xiaomimimo-mimo-v2.5"

[phases.confirm_seed42]
benchmark_slugs = ["bbeh", "gpqa_diamond"]
split_overrides = { bbeh = "count300_seed42", gpqa_diamond = "full198_seed42" }
required_development_audit = "configs/families/risk_controlled_trace_mad/retired/v5_hsgsa_dev_replay_audit.json"
bbeh_metric = "task_harmonic"
no_interim_method_accuracy_inspection = true
