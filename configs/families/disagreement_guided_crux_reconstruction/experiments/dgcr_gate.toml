name = "dgcr_gate"
description = "Frozen Disagreement-Guided Crux Reconstruction BBEH 100-to-200 gate."
benchmark_configs = ["configs/core/shared/benchmarks/bbeh/bbeh-main.toml"]
protocol = "configs/families/disagreement_guided_crux_reconstruction/protocols/dgcr_v1.toml"
primary_model_ref = "xiaomimimo/mimo-v2.5"
global_seed = 42
max_concurrent_requests = 15
requests_per_minute_limit = 18
provider_audit_path = "configs/families/disagreement_guided_crux_reconstruction/provider_audits/dgcr_provider_audit_v1.json"

[cache_namespaces]
provider_audit = "dgcr-provider-audit-v1"
development = "dgcr-dev-v1"
heldout = "dgcr-heldout-v1"

[phases.development]
benchmark_slugs = ["bbeh"]
split_overrides = { bbeh = "dgcr_dev100_seed42" }

[phases.heldout]
benchmark_slugs = ["bbeh"]
split_overrides = { bbeh = "dgcr_holdout200_seed42" }
