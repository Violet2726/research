expansion_model_refs = ["xiaomimimo/mimo-v2.5-pro"]
max_expansion_calls = 3
adaptive_extra_solver_calls = 2
max_total_solver_calls = 7
promotion_min_independent_support = 2
promotion_margin_min = 1.25
mc_shuffle_min_agreement = 2
require_stage_a_challenger_support = true
allow_single_verifier_promotion = false
false_consensus_probe = false
max_trigger_rate = 0.30
trigger_buckets = ["weak_split", "format_risk", "deterministic_repair_only"]

stage_a_temperature = 0.7
verifier_temperature = 0.0
top_p = 1.0
strong_majority_count = 4
leader_lock_count = 4
weak_majority_count = 3
concrete_evidence_min_chars = 12
stage_a_max_tokens = 0
verifier_max_tokens = 1024
promotion_confidence_min = 0.72
promotion_score_margin = 0.15
