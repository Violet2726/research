name = "dmad_reasoning_main"
description = "DMAD 论文正文 LLM 主线复现实验，只包含 MATH 与 GPQA。"
evaluation_scope = "paper_main"
paper_alignment_version = "dmad_iclr2025_llm_text_v1"
benchmark_configs = [
  "configs/core/shared/benchmarks/competition_math/MATH.toml",
  "configs/core/shared/benchmarks/gpqa/dataset.toml",
]
protocol = "configs/families/dmad/protocols/dmad_3a_r2.toml"
global_seed = 42
prompt_version = "dmad_v1_json"
primary_model_ref = "xiaomimimo/mimo-v2.5"

[[methods]]
name = "dmad_single_cot"
mode = "single_cot"

[[methods]]
name = "dmad_single_sbp"
mode = "single_sbp"

[[methods]]
name = "dmad_single_pot_l2m"
mode = "single_pot"

[[methods]]
name = "dmad_single_cot_sc"
mode = "single_cot_sc"

[[methods]]
name = "dmad_single_sbp_sc"
mode = "single_sbp_sc"

[[methods]]
name = "dmad_single_pot_l2m_sc"
mode = "single_pot_sc"

[[methods]]
name = "dmad_self_refine"
mode = "self_refine_cot"

[[methods]]
name = "dmad_self_contrast"
mode = "self_contrast_cot_sbp_pot"

[[methods]]
name = "dmad_mrp"
mode = "mrp_cot_sbp_pot"

[[methods]]
name = "mad_persona_d"
mode = "mad_persona_d"
roster = "configs/families/dmad/rosters/mad_persona_discriminative_3agent.toml"

[[methods]]
name = "mad_persona_e"
mode = "mad_persona_e"
roster = "configs/families/dmad/rosters/mad_persona_extractive_3agent.toml"

[[methods]]
name = "mad_all_cot"
mode = "mad_all_cot"
roster = "configs/families/dmad/rosters/mad_all_cot_3agent.toml"

[[methods]]
name = "mad_all_sbp"
mode = "mad_all_sbp"
roster = "configs/families/dmad/rosters/mad_all_sbp_3agent.toml"

[[methods]]
name = "mad_all_pot"
mode = "mad_all_pot"
roster = "configs/families/dmad/rosters/mad_all_pot_3agent.toml"

[[methods]]
name = "dmad_cot_sbp_pot"
mode = "dmad_cot_sbp_pot"
roster = "configs/families/dmad/rosters/dmad_cot_sbp_pot_3agent.toml"

[phases.count20]
split_overrides = { competition_math = "count20_seed0", gpqa_diamond = "count20_seed42" }

[phases.count100]
split_overrides = { competition_math = "count100_seed0", gpqa_diamond = "count100_seed42" }

[phases.count300]
split_overrides = { competition_math = "count100_seed0", gpqa_diamond = "full198_seed42" }
