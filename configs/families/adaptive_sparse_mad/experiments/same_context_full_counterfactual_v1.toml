name = "same_context_full_counterfactual_v1"
description = "A-SMAD full-benchmark counterfactual V1 screen with heterogeneous Stage A, adaptive gate baseline, and forced counterfactual candidate generation on collapse-risk samples."
benchmark_configs = [
  "configs/core/shared/benchmarks/hotpotqa/validation_distractor.toml",
  "configs/core/shared/benchmarks/competition_math/MATH.toml",
  "configs/core/shared/benchmarks/mmlu-pro/test.toml",
  "configs/core/shared/benchmarks/gpqa/dataset.toml",
  "configs/core/shared/benchmarks/math500/test.toml",
  "configs/core/shared/benchmarks/strategyqa/dev.toml",
  "configs/core/shared/benchmarks/gsm8k/test.toml",
]
protocol = "configs/families/adaptive_sparse_mad/protocols/shared_pair_sparse.toml"
control_catalog = "configs/families/adaptive_sparse_mad/controls/same_context_controls.toml"
aggregate_methods = ["hetero_vote_3", "adaptive_gate_v4", "adaptive_counterfactual_v1"]
max_adaptive_addon_calls = 2
global_seed = 42
prompt_version = "adaptive_sparse_mad_v4_evidence_gate"
stage_a_prompt_version = "adaptive_sparse_mad_v4_evidence_gate"
adaptive_prompt_version = "adaptive_sparse_mad_v4_evidence_gate"
primary_model_ref = "xiaomimimo/mimo-v2.5"

[phases.count20]
split_overrides = { gsm8k = "count20_seed42", strategyqa = "count20_seed42", hotpotqa = "count20_seed42", competition_math = "count20_seed0", mmlu_pro = "count20_seed42", gpqa_diamond = "count20_seed42", math500 = "count20_seed42" }

[phases.count100]
split_overrides = { gsm8k = "count100_seed42", strategyqa = "count100_seed42", hotpotqa = "count100_seed42", competition_math = "count100_total_seed0", mmlu_pro = "count100_seed42", gpqa_diamond = "count100_seed42", math500 = "count100_seed42" }
