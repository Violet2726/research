name = "same_context_main_v5"
description = "A-SMAD same-context V5 mainline with heterogeneous Stage A and trigger-only free-text sparse debate."
benchmark_configs = [
  "configs/core/shared/benchmarks/math500/test.toml",
  "configs/core/shared/benchmarks/hotpotqa/validation_distractor.toml",
  "configs/core/shared/benchmarks/gpqa/dataset.toml",
  "configs/core/shared/benchmarks/strategyqa/dev.toml",
  "configs/core/shared/benchmarks/mmlu-pro/test.toml",
]
protocol = "configs/families/adaptive_sparse_mad/protocols/shared_pair_sparse.toml"
control_catalog = "configs/families/adaptive_sparse_mad/controls/same_context_controls.toml"
aggregate_methods = ["hetero_vote_3", "adaptive_sparse_debate_v1"]
max_adaptive_addon_calls = 2
global_seed = 42
prompt_version = "adaptive_sparse_mad_free_text_debate_v1"
stage_a_prompt_version = "adaptive_sparse_mad_free_text_debate_v1"
adaptive_prompt_version = "adaptive_sparse_mad_free_text_debate_v1"
primary_model_ref = "xiaomimimo/mimo-v2.5"

[phases.count20]
split_overrides = { math500 = "count20_seed42", hotpotqa = "count20_seed42", gpqa_diamond = "count20_seed42", strategyqa = "count20_seed42", mmlu_pro = "count20_seed42" }

[phases.count100]
split_overrides = { math500 = "count100_seed42", hotpotqa = "count100_seed42", gpqa_diamond = "count100_seed42", strategyqa = "count100_seed42", mmlu_pro = "count100_seed42" }
