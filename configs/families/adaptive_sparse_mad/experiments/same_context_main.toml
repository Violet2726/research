name = "same_context_main"
description = "A-SMAD same-context main experiment with generic Stage A v2 schema and constraint-aware aggregation."
benchmark_configs = [
  "configs/core/shared/benchmarks/gsm8k/test.toml",
  "configs/core/shared/benchmarks/strategyqa/dev.toml",
  "configs/core/shared/benchmarks/hotpotqa/validation_distractor.toml",
]
protocol = "configs/families/adaptive_sparse_mad/protocols/shared_pair_sparse.toml"
control_catalog = "configs/families/adaptive_sparse_mad/controls/same_context_controls.toml"
global_seed = 42
prompt_version = "adaptive_sparse_mad_v2_task_schema"
primary_model_ref = "xiaomimimo/mimo-v2.5"

[phases.count20]
split_overrides = { gsm8k = "count20_seed42", strategyqa = "count20_seed42", hotpotqa = "count20_seed42" }

[phases.count100]
split_overrides = { gsm8k = "count100_seed42", strategyqa = "count100_seed42", hotpotqa = "count100_seed42" }
