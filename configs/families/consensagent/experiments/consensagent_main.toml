# CONSENSAGENT 主实验配置
name = "consensagent_main"
description = "CONSENSAGENT: 基于触发机制的多智能体辩论，通过检测谄媚行为提升共识质量。含 CoT 和 MAD 对比基线。"
experiment_note = """
实验定位：CONSENSAGENT 框架论文复现实验。
Phase 3 使用 LLM in-context learning（1 个 few-shot 示例）替代微调 GPT-4o。
对比方法：CoT（单智能体）、MAD（标准多智能体辩论）
"""
benchmark_configs = [
  "configs/core/shared/benchmarks/hotpotqa/validation_distractor.toml",
  "configs/core/shared/benchmarks/gsm8k/test.toml",
]
control_catalog = "configs/core/shared/controls/no_comm_equal_budget.toml"
global_seed = 42
prompt_version = "consensagent_paper_v1"
max_concurrent_requests = 90
requests_per_minute_limit = 95
tokens_per_minute_limit = 9000000
primary_model_ref = "xiaomimimo/mimo-v2.5"

[[setups]]
name = "consensagent_3a"
protocol = "configs/families/consensagent/protocols/default.toml"
roster = "configs/families/consensagent/rosters/homogeneous_3agent.toml"
matched_controls = ["cot_1", "mv_6"]

[[setups]]
name = "consensagent_3a_hetero"
protocol = "configs/families/consensagent/protocols/default.toml"
roster = "configs/families/consensagent/rosters/heterogeneous_3agent.toml"
matched_controls = ["cot_1", "mv_6"]

[[setups]]
name = "mad_3a_r1"
protocol = "configs/families/consensagent/protocols/mad_r1.toml"
roster = "configs/families/consensagent/rosters/homogeneous_3agent.toml"
matched_controls = ["cot_1", "mv_6"]

[[setups]]
name = "mad_3a_r2"
protocol = "configs/families/consensagent/protocols/mad_r2.toml"
roster = "configs/families/consensagent/rosters/homogeneous_3agent.toml"
matched_controls = ["cot_1", "mv_6"]

[phases.count20]
split_suffix = "count20_seed42"
setups = ["consensagent_3a", "mad_3a_r1", "mad_3a_r2"]

[phases.count100]
split_suffix = "count100_seed42"
setups = ["consensagent_3a"]

[phases.count300]
split_overrides = { gsm8k = "count300_seed42", hotpotqa = "count300_seed42" }
setups = ["consensagent_3a"]
