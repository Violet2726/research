name = "baseline_ceiling_v1_zero_shot_cot"
description = "Fixed-budget baseline ceiling search on six same-context benchmarks using a zero-shot CoT prompt family."
experiment_note = """
实验定位：用于 `xiaomimimo/mimo-v2.5` 的固定预算 baseline ceiling 审计。
方法范围：`cot_1 / mv_3 / sc_5`，只搜索 prompt family 与全局解码温度，不做数据集定向调参。
严谨口径：`count20` 只作 screen；`count100` 才是 authoritative ceiling phase。
"""
method_catalog = "configs/families/single_agent/methods/baseline_ceiling_candidates.toml"
benchmark_configs = [
  "configs/core/shared/benchmarks/competition_math/MATH.toml",
  "configs/core/shared/benchmarks/gpqa/dataset.toml",
  "configs/core/shared/benchmarks/gsm8k/test.toml",
  "configs/core/shared/benchmarks/hotpotqa/validation_distractor.toml",
  "configs/core/shared/benchmarks/math500/test.toml",
  "configs/core/shared/benchmarks/mmlu-pro/test.toml",
]
global_seed = 42
reruns_per_method = 3
cot_uses_reruns = true
prompt_version = "zero_shot_cot_v1"
primary_model_ref = "xiaomimimo/mimo-v2.5"

[phases.count20]
split_overrides = { competition_math = "count20_seed0", gpqa_diamond = "count20_seed42", gsm8k = "count20_seed42", hotpotqa = "count20_seed42", math500 = "count20_seed42", mmlu_pro = "count20_seed42" }
methods = [
  "cot_1_temp_0p0",
  "cot_1_temp_0p7",
  "mv_3_temp_0p5",
  "mv_3_temp_0p7",
  "mv_3_temp_1p0",
  "sc_5_temp_0p5",
  "sc_5_temp_0p7",
  "sc_5_temp_1p0",
]
reruns_override = 1

[phases.count100]
split_overrides = { competition_math = "count100_total_seed0", gpqa_diamond = "count100_seed42", gsm8k = "count100_seed42", hotpotqa = "count100_seed42", math500 = "count100_seed42", mmlu_pro = "count100_seed42" }
methods = [
  "cot_1_temp_0p0",
  "cot_1_temp_0p7",
  "mv_3_temp_0p5",
  "mv_3_temp_0p7",
  "mv_3_temp_1p0",
  "sc_5_temp_0p5",
  "sc_5_temp_0p7",
  "sc_5_temp_1p0",
]
reruns_override = 3
