name = "mad_innovation_baseline"
description = "MAD mechanism innovation baseline across five representative benchmarks."
experiment_note = """
Purpose: establish a focused baseline for MAD mechanism innovation research.
Benchmarks: math500 (math reasoning), hotpotqa (multi-hop QA), gpqa_diamond (hard science), strategyqa (strategic reasoning), mmlu-pro (knowledge).
Methods: cot_1, sc_3, sc_5, mad_3a_r1, mad_3a_r2, and mad_5a_r1.
Phases: count20, count100, count300, and count500.
"""
benchmark_configs = [
  "configs/core/shared/benchmarks/math500/test.toml",
  "configs/core/shared/benchmarks/hotpotqa/validation_distractor.toml",
  "configs/core/shared/benchmarks/gpqa/dataset.toml",
  "configs/core/shared/benchmarks/strategyqa/dev.toml",
  "configs/core/shared/benchmarks/mmlu-pro/test.toml",
]
control_catalog = "configs/families/single_agent/methods/common.toml"
control_methods = ["cot_1", "sc_3", "sc_5"]
method_order = ["cot_1", "sc_3", "sc_5", "mad_3a_r1", "mad_3a_r2", "mad_5a_r1"]
global_seed = 42
control_prompt_version = "single_agent_free_text_v1"
mad_prompt_version = "sc_aligned_mad_free_text_v1"
control_output_protocol = "free_text_answer_v1"
mad_initial_output_protocol = "free_text_answer_v1"
mad_debate_output_protocol = "free_text_answer_v1"
primary_model_ref = "xiaomimimo/mimo-v2.5"
max_concurrent_requests = 1000
requests_per_minute_limit = 1000

[[setups]]
name = "mad_3a_r1"
protocol = "configs/families/multi_agent/protocols/vanilla_mad_r1.toml"
roster = "configs/families/multi_agent/rosters/homogeneous_3agent.toml"

[[setups]]
name = "mad_3a_r2"
protocol = "configs/families/multi_agent/protocols/vanilla_mad_r2.toml"
roster = "configs/families/multi_agent/rosters/homogeneous_3agent.toml"

[[setups]]
name = "mad_5a_r1"
protocol = "configs/families/multi_agent/protocols/vanilla_mad_r1.toml"
roster = "configs/families/multi_agent/rosters/homogeneous_5agent.toml"

[phases.count20]
split_overrides = { math500 = "count20_seed42", hotpotqa = "count20_seed42", gpqa_diamond = "count20_seed42", strategyqa = "count20_seed42", mmlu_pro = "count20_seed42" }
setups = ["mad_3a_r1", "mad_3a_r2", "mad_5a_r1"]

[phases.count100]
split_overrides = { math500 = "count100_seed42", hotpotqa = "count100_seed42", gpqa_diamond = "count100_seed42", strategyqa = "count100_seed42", mmlu_pro = "count100_seed42" }
setups = ["mad_3a_r1", "mad_3a_r2", "mad_5a_r1"]

[phases.count300]
split_overrides = { math500 = "count300_seed42", hotpotqa = "count300_seed42", gpqa_diamond = "full198_seed42", strategyqa = "full229_seed42", mmlu_pro = "count300_seed42" }
setups = ["mad_3a_r1", "mad_3a_r2", "mad_5a_r1"]

[phases.count500]
split_overrides = { math500 = "count500_seed42", hotpotqa = "count500_seed42", gpqa_diamond = "full198_seed42", strategyqa = "full229_seed42", mmlu_pro = "count500_seed42" }
setups = ["mad_3a_r1", "mad_3a_r2", "mad_5a_r1"]
