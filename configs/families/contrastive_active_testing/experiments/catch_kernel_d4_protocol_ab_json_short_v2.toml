name = "catch_kernel_d4_protocol_ab_json_short_v2"
description = "D4 Stage-A-only output reliability A/B arm: reasoning-first JSON with short-reasoning prompt variant and the unchanged high completion-token cap."
study_type = "catch_kernel_cross_domain_development"
confirmatory = false
kernel_revision = "d4_proof_carrying_v1"
provider_audit_path = "local/audits/catch_kernel_d4_provider_audit.json"
benchmark_configs = [
  "configs/core/shared/benchmarks/bbeh/bbeh-main.toml",
  "configs/core/shared/benchmarks/musr/all.toml",
  "configs/core/shared/benchmarks/gpqa/dataset.toml",
]
protocol = "configs/families/contrastive_active_testing/protocols/catch_kernel_d4_v1.toml"
primary_model_ref = "xiaomimimo/mimo-v2.5"
global_seed = 42
provider_runtime_profile = "xiaomimimo_75x95_validated_v1"
max_concurrent_requests = 75
requests_per_minute_limit = 95

[d4_output]
stage_a_protocol = "reasoning_first_json"
prompt_variant = "short_reasoning_v3"
parse_failure_target = 0.002
accuracy_noninferiority_margin = 0.005
conflicts_fail_closed = true

[d4_risk]
evidence_path = "configs/families/contrastive_active_testing/d4_gate_evidence.example.json"
new_exact_override_enabled = false
semantic_override_enabled = false

[cache_namespaces]
development = "catch-dev-kernel_d4_v1"
heldout = "catch-heldout-kernel_d4_v1"
confirmation = "catch-confirm-kernel_d4_v1"

[baseline_cache_namespaces]
development = "catch-dev-kernel_d3_v1,catch-dev-kernel_d2_v1,catch-dev-kernel_d1_v3,catch-dev-cert_v2,catch-dev-cert_v1"
heldout = "catch-heldout-kernel_d3_v1,catch-heldout-kernel_d2_v1,catch-heldout-kernel_d1_v3,catch-heldout-cert_v2,catch-heldout-cert_v1"
confirmation = "catch-confirm-kernel_d3_v1,catch-confirm-kernel_d2_v1,catch-confirm-kernel_d1_v3,catch-confirm-cert_v2,catch-confirm-cert_v1"

[phases.development]
benchmark_slugs = ["bbeh", "musr", "gpqa_diamond"]
split_overrides = { bbeh = "catch_kernel_d3_dev100_seed42", musr = "catch_kernel_d3_dev100_seed42", gpqa_diamond = "count100_seed42" }
sample_limits = { bbeh = 100, musr = 100, gpqa_diamond = 100 }
selection_strategy = "frozen_manifest"
selection_seed = 42
run_direct_judge = false
evaluation_role = "d4_output_protocol_ab_reasoning_first_json_short_v2"
