name = "catch_kernel_d4_protocol_independent_validation_tagged_v2"
description = "Blocked template for the fresh, sealed, cross-domain tagged-text validation required after protocol selection and before D4 calibration."
study_type = "catch_kernel_cross_domain_development"
confirmatory = false
kernel_revision = "d4_proof_carrying_v1"
provider_audit_path = "local/audits/catch_kernel_d4_provider_audit.json"
benchmark_configs = [
  "configs/core/shared/benchmarks/d4_independent_validation/bbeh_extension.toml",
  "configs/core/shared/benchmarks/d4_independent_validation/musr_x.toml",
  "configs/core/shared/benchmarks/d4_independent_validation/supergpqa_science.toml",
]
protocol = "configs/families/contrastive_active_testing/protocols/catch_kernel_d4_v1.toml"
primary_model_ref = "xiaomimimo/mimo-v2.5"
global_seed = 42
provider_runtime_profile = "xiaomimimo_75x95_validated_v1"
max_concurrent_requests = 75
requests_per_minute_limit = 95

[d4_output]
stage_a_protocol = "tagged_text"
prompt_variant = "legacy"
parse_failure_target = 0.01
stage_a_quorum_minimum_valid_turns = 3
stage_a_quorum_failure_target = 0.01
conflicts_fail_closed = true

[d4_risk]
evidence_path = "configs/families/contrastive_active_testing/d4_gate_evidence.example.json"
new_exact_override_enabled = false
semantic_override_enabled = false

[cache_namespaces]
development = "catch-dev-kernel_d4_v1"
heldout = "catch-heldout-kernel_d4_v1"
confirmation = "catch-confirm-kernel_d4_v1"

[baseline_cache_namespaces]
development = "catch-dev-kernel_d3_v1,catch-dev-kernel_d2_v1,catch-dev-kernel_d1_v3,catch-dev-cert_v2,catch-dev-cert_v1"
heldout = "catch-heldout-kernel_d3_v1,catch-heldout-kernel_d2_v1,catch-heldout-kernel_d1_v3,catch-heldout-cert_v2,catch-heldout-cert_v1"
confirmation = "catch-confirm-kernel_d3_v1,catch-confirm-kernel_d2_v1,catch-confirm-kernel_d1_v3,catch-confirm-cert_v2,catch-confirm-cert_v1"

[phases.development]
sealed_data_ready = false
validation_data_role = "fresh_independent_protocol_validation_after_prompt_freeze"
sealed_manifest_paths = {}
sealed_manifest_expectations = {}
sealed_manifest_split = "protocol_validation"
benchmark_slugs = ["bbeh_extension", "musr_x", "supergpqa_science"]
split_overrides = { bbeh_extension = "protocol_validation", musr_x = "protocol_validation", supergpqa_science = "protocol_validation" }
sample_limits = { bbeh_extension = 100, musr_x = 100, supergpqa_science = 100 }
selection_strategy = "d4_sealed_manifest_only"
selection_seed = 42
run_direct_judge = false
evaluation_role = "d4_output_protocol_independent_validation_tagged_v2"
# The custodian must fill all three hashes before setting sealed_data_ready=true.
expected_selection_sha256 = {}
