name = "catch_gate"
description = "Best-effort CATCH-ICV indexed contrast verification on BBEH development, heldout, or confirmation splits."
benchmark_configs = ["configs/core/shared/benchmarks/bbeh/bbeh-main.toml"]
protocol = "configs/families/contrastive_active_testing/protocols/catch_v3.toml"
primary_model_ref = "xiaomimimo/mimo-v2.5"
global_seed = 42
max_concurrent_requests = 15
requests_per_minute_limit = 18
[cache_namespaces]
development = "catch-dev-v3"
heldout = "catch-heldout-v3"
confirmation = "catch-confirm-v3"

[baseline_cache_namespaces]
development = "catch-dev-v1"

[phases.development]
benchmark_slugs = ["bbeh"]
split_overrides = { bbeh = "dgcr_dev100_seed42" }
run_direct_judge = true

[phases.heldout]
benchmark_slugs = ["bbeh"]
split_overrides = { bbeh = "dgcr_holdout200_seed42" }
run_direct_judge = true

[phases.confirmation]
benchmark_slugs = ["bbeh"]
split_overrides = { bbeh = "full4520_seed42" }
exclude_splits = { bbeh = ["dgcr_dev100_seed42", "dgcr_holdout200_seed42"] }
run_direct_judge = false
