protocol_version = "catch_v3"
stage_candidates = 5
resample_candidates = 3
witness_count = 2
direct_judge_count = 3
pair_judge_count = 3
coordinates_per_pair = 3
max_selected_contrasts = 6
temperature = 0.7
top_p = 1.0
solver_max_tokens = 16384
role_max_tokens = 4096
max_network_attempts = 62000

# One-shot, gold-free structural preflight. The command always terminates
# after these 20 disagreement samples, whether the checks pass or fail.
preflight_sample_count = 20
preflight_code_coverage_threshold = 0.60
preflight_coordinate_validity_threshold = 0.95
preflight_usable_pair_threshold = 0.90
preflight_decisive_threshold = 0.80
preflight_panel_agreement_threshold = 0.70
